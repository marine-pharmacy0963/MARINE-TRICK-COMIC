howToc(){openToken++;activeEpisode=-1;clearTimeout(saveTimer);reader.classList.remove("on");home.style.display="";resume.hidden=true;viewer.innerHTML=""}async function openEpisode(i,page=0){let x=E[i];if(!x)return;const token=++openToken;activeEpisode=i;clearTimeout(saveTimer);page=Math.max(0,Math.min(page,x.pages.length-1));home.style.display="none";reader.classList.add("on");readerTitle.textContent=x.title;desc.textContent=x.desc||"";viewer.innerHTML="";viewer.scrollLeft=0;const ready=[];x.pages.forEach((src,j)=>{let d=document.createElement("div"),im=document.createElement("img");d.className="page";d.dataset.page=j;ready.push(new Promise(resolve=>{im.onload=resolve;im.onerror=()=>{im.alt="画像を読み込めません。目次から開き直してください。";resolve()}}));im.decoding="async";im.src=src;im.alt=x.title+" "+(j+1)+"ページ";im.draggable=ALLOW_SAVE;d.appendChild(im);viewer.appendChild(d)});await Promise.all(ready);if(token!==openToken)return;requestAnimationFrame(()=>{if(token!==openToken)return;let target=viewer.children[Math.max(0,Math.min(page,viewer.children.length-1))];viewer.scrollLeft=target?target.offsetLeft:0;saveProgress(i,page)})}function chooseEpisode(i){let p=progress();if(p&&p.ep===i&&p.page>0&&p.page<(E[i]?.pages?.length||0)){pending={i,page:p.page};document.getElementById("resumeText").textContent=E[i].title+" の "+(p.page+1)+"ページ目まで読んでいます。";resume.hidden=false}else openEpisode(i,0)}function buildToc(){grid.innerHTML="";E.forEach((x,i)=>{let b=document.createElement("button");b.className="tocBtn";b.innerHTML="<b>"+escapeHtml(x.title)+"</b><span>"+escapeHtml(x.desc||((x.pages?.length||0)+"ページ"))+"</span>";b.onclick=()=>chooseEpisode(i);grid.appendChild(b)});if(!E.length)grid.innerHTML='<div class="empty">公開中の漫画はありません。</div>'}function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}document.getElementById("tocBack").onclick=showToc;document.getElementById("resumeContinue").onclick=()=>{let p=pending;resume.hidden=true;if(p)openEpisode(p.i,p.page)};document.getElementById("resumeStart").onclick=()=>{let p=pending;resume.hidden=true;if(p)openEpisode(p.i,0)};viewer.addEventListener("scroll",()=>{clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(!reader.classList.contains("on"))return;let children=[...viewer.children];if(!children.length)return;let center=viewer.scrollLeft+viewer.clientWidth/2,best=0,dist=Infinity;children.forEach((el,i)=>{let d=Math.abs((el.offsetLeft+el.offsetWidth/2)-center);if(d<dist){dist=d;best=i}});if(activeEpisode>=0)saveProgress(activeEpisode,best)},180)});if(!ALLOW_SAVE){document.body.style.webkitUserSelect="none";document.body.style.userSelect="none";document.body.style.webkitTouchCallout="none";document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("dragstart",e=>e.preventDefault())}buildToc();</script></body></html>
